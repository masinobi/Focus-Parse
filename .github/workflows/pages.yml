name: Demo

# Publishes `demo/` — one self-contained HTML page, no build step — to GitHub
# Pages, so the repository has something to click before it has something to
# clone.
#
# Pages is on, with "GitHub Actions" as the source, so this runs on its own
# when the demo changes. It was manual-only for one commit because Pages cannot
# be enabled on a private repository on a free plan, and a workflow that fails
# on a settings state rather than a fault is worse than no workflow.
#
# The page is a demo. It is not the app: the app needs a browser with a real
# speech synthesizer and a document of your own.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight, since a half-finished
# deploy is a broken page rather than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - id: deployment
        uses: actions/deploy-pages@v4
